<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budapest 2084</title>
    <!-- Use Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>

<div id="game-wrapper">
    <div id="stats-container" class="stats-container">
        <div id="time-counter" class="stat-box">Time: 0</div>
        <div id="thread-id-display">
            <button id="prev-thread" disabled><i class="fas fa-minus"></i></button>
            <span>Thread ID:</span>
            <span id="current-thread">∅</span>
            <button id="next-thread" disabled><i class="fas fa-plus"></i></button>
        </div>
        <div id="money-counter" class="stat-box"><i class="fas fa-money-bill-alt"></i><span id="money-amount">0</span></div>
        <div id="level-counter" class="stat-box">Level: 1</div>
    </div>
    
    <div id="main-content-area">
        <div id="game-board"></div>
        <div class="device-panel">
            <div class="device-section">
                <div class="device-header with-btn">
                    <span id="qrg-label">QRG</span>
                    <button id="random-generator-btn" disabled>Branch</button>
                </div>
            </div>
            
            <div class="device-section">
                <div class="device-header">
                    <span id="eigengram-label">Eigengram</span>
                    <div class="device-controls">
                        <span>Lifetime: <span id="eigengram-lifetime">0</span></span>
                        <button id="eigengram-on-btn" class="device-icon-btn" disabled>
                            <i id="eigengram-icon" class="fas fa-lightbulb"></i>
                        </button>
                    </div>
                </div>
                <input id="eigengram-message-panel" class="text-input" placeholder="message to the otherself..." disabled />
            </div>
            
            <div class="device-section">
                <div class="device-header">
                    <span id="chronogram-label">Chronogram</span>
                    <div class="device-controls">
                        <span>Lifetime: <span id="chronogram-lifetime">0</span></span>
                        <button id="chronogram-on-btn" class="device-icon-btn" disabled>
                            <i id="chronogram-icon" class="fas fa-lightbulb"></i>
                        </button>
                    </div>
                </div>
                <input id="chronogram-message-panel" class="text-input" placeholder="message to the post-/preself..." disabled />
                <div id="chronogram-button-group">
                    <button id="send-back-btn" disabled>Send Back</button>
                </div>
            </div>
            
            <div class="device-section">
                 <button id="throw-thread-btn">Throw thread!</button>
            </div>
        </div>
    </div>
    <div id="game-over-message">GAME OVER</div>
    <div id="game-win-message">YOU WIN!</div>
    <div id="defuse-modal">
        <h3>Which wire to cut?</h3>
        <div>
            <button id="cut-black-wire" style="background-color: #333;">Black (B)</button>
            <button id="cut-green-wire" style="background-color: var(--accent-color);">Green (G)</button>
        </div>
    </div>
    <div id="info-modal">
        <h3 id="info-modal-title">Information</h3>
        <p id="info-modal-text"></p>
        <button id="info-modal-ok">OK</button>
    </div>
</div>

<script src="levels.js"></script>
<script src="progressTurn.js"></script>
<script src="init.js"></script>
<script src="drawGrid.js"></script>
<script src="drawEntities.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const gameWrapper = document.getElementById('game-wrapper');
        const board = document.getElementById('game-board');
        const gameOverMessage = document.getElementById('game-over-message');
        const gameWinMessage = document.getElementById('game-win-message');
        const timeCounterDisplay = document.getElementById('time-counter');
        const levelCounterDisplay = document.getElementById('level-counter');
        const moneyAmountDisplay = document.getElementById('money-amount');
        const currentThreadDisplay = document.getElementById('current-thread');
        
        const prevThreadBtn = document.getElementById('prev-thread');
        const nextThreadBtn = document.getElementById('next-thread');
        const throwThreadBtn = document.getElementById('throw-thread-btn');
        const randomGeneratorBtn = document.getElementById('random-generator-btn');

        const qrgLabel = document.getElementById('qrg-label');
        const eigengramLabel = document.getElementById('eigengram-label');
        const chronogramLabel = document.getElementById('chronogram-label');

        const eigengramOnBtn = document.getElementById('eigengram-on-btn');
        const eigengramIcon = document.getElementById('eigengram-icon');
        const eigengramLifetimeDisplay = document.getElementById('eigengram-lifetime');
        const eigengramMessagePanel = document.getElementById('eigengram-message-panel');

        const chronogramOnBtn = document.getElementById('chronogram-on-btn');
        const chronogramIcon = document.getElementById('chronogram-icon');
        const chronogramLifetimeDisplay = document.getElementById('chronogram-lifetime');
        const chronogramMessagePanel = document.getElementById('chronogram-message-panel');
        const sendBackBtn = document.getElementById('send-back-btn');

        const defuseModal = document.getElementById('defuse-modal');
        const cutBlackWireBtn = document.getElementById('cut-black-wire');
        const cutGreenWireBtn = document.getElementById('cut-green-wire');

        const infoModal = document.getElementById('info-modal');
        const infoModalText = document.getElementById('info-modal-text');
        const infoModalOkBtn = document.getElementById('info-modal-ok');

        const GRID_SIZE = 8;
        const CELL_TYPES = {
            road: 'road',
            grass: 'grass',
            wall: 'wall',
            fence: 'fence',
            flag: 'flag',
            trapBuilding: 'trapBuilding'
        };

        const STARTING_LIFETIME = 5;
        const DEATH_TIMER = 3;
        const BOMB_TIMER = 3;
        
        let currentLevel = 0;
        let threadIds = [];
        let currentThreadIndex = 0;
        let threadHistory = {};
        let eigengramMessages = {};
        let chronogramMessages = {};
        let eigengramSourceThreadId = null;
        let isGameOver = false;
        let playerDesiredMove = null;
        let activeBombToDefuse = null;

        //levels (imported)

        const deepClone = (obj) => JSON.parse(JSON.stringify(obj));


        // --- FUNCTION ORDER FIX: Define handlers before they are called ---

        function handleRestart(e) {
            if(e.key === 'r' || e.key === 'R') initGame();
        }

        function handleKeyDown(e) {
            if (isGameOver) {
                handleRestart(e);
                return;
            }
            if (threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0].playerStatus === 'dead') {
                progressTurn();
                return;
            }

            const keyMap = {
                'ArrowUp': {x:0, y:-1}, 'ArrowDown': {x:0, y:1},
                'ArrowLeft': {x:-1, y:0}, 'ArrowRight': {x:1, y:0}
            };

            if (keyMap[e.key]) {
                e.preventDefault();
                playerDesiredMove = keyMap[e.key];
                progressTurn();
            } else {
                switch (e.key.toLowerCase()) {
                    case 'd':
                        e.preventDefault();
                        const currentState = threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0];
                        const playerPos = currentState.playerPos;
                        const bombOnCell = currentState.bombs.find(b => b.x === playerPos.x && b.y === playerPos.y);
                        if (bombOnCell) {
                            showDefuseModal(bombOnCell);
                        } else {
                            handleCarInteraction();
                        }
                        break;
                    case ' ': e.preventDefault(); progressTurn(); flashLightning(); break;
                    case 'r': e.preventDefault(); randomGeneratorBtn.click(); break;
                    case 'e': e.preventDefault(); if (!eigengramOnBtn.disabled) eigengramOnBtn.click(); break;
                    case 'c': e.preventDefault();
                        const state = threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0];
                        if (state.chronogram.isOn && !sendBackBtn.disabled) sendBackBtn.click();
                        else if (!chronogramOnBtn.disabled) chronogramOnBtn.click();
                        break;
                }
            }
        }

        // --- EVENT HANDLERS & MODALS ---
        
        function handleCarInteraction() {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            
            if (currentState.isDriving) {
                const { x, y } = currentState.playerPos;
                const directions = [{x:currentState.lastMoveDirection.x, y:currentState.lastMoveDirection.y},{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
                for (const dir of directions) {
                    const newX = x + dir.x, newY = y + dir.y;
                    if (!isObstacle(newX, newY, currentState.grid)) {
                        currentState.isDriving = false;
                        currentState.playerPos = {x: newX, y: newY};
                        break;
                    }
                }
            } else if (currentState.playerPos.x === currentState.playerCar.x && currentState.playerPos.y === currentState.playerCar.y) {
                currentState.isDriving = true;
            }

            history.push(currentState);
            drawGrid();
        }

        function showDefuseModal(bomb) {
            activeBombToDefuse = bomb;
            defuseModal.style.display = 'block';
            document.removeEventListener('keydown', handleKeyDown);
            document.addEventListener('keydown', handleDefuseKeyPress);
        }

        function hideDefuseModal() {
            activeBombToDefuse = null;
            defuseModal.style.display = 'none';
            document.removeEventListener('keydown', handleDefuseKeyPress);
            document.addEventListener('keydown', handleKeyDown);
        }

        function handleDefuseAttempt(chosenWire) {
            if (!activeBombToDefuse) return;

            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            const bomb = currentState.bombs.find(b => b.x === activeBombToDefuse.x && b.y === activeBombToDefuse.y);

            if (bomb) {
                if (bomb.correctWire === chosenWire) {
                    currentState.bombs = currentState.bombs.filter(b => b.x !== bomb.x || b.y !== bomb.y);
                } else {
                    triggerExplosion(bomb, currentState);
                }
            }

            history.push(currentState);
            hideDefuseModal();
            drawGrid();
        }

        function handleDefuseKeyPress(e) {
            const key = e.key.toLowerCase();
            if (key === 'b') {
                handleDefuseAttempt('b');
            } else if (key === 'g') {
                handleDefuseAttempt('g');
            }
        }

        function showInfoModal(text) {
            infoModalText.textContent = text;
            infoModal.style.display = 'block';
            document.removeEventListener('keydown', handleKeyDown);
            document.addEventListener('keydown', hideInfoModalOnKeyPress);
        }

        function hideInfoModal() {
            infoModal.style.display = 'none';
            document.removeEventListener('keydown', hideInfoModalOnKeyPress);
            document.addEventListener('keydown', handleKeyDown);
        }

        function hideInfoModalOnKeyPress(e) {
            e.preventDefault();
            hideInfoModal();
        }

        // --- GAME LOGIC ---

        function createLevelState(levelIndex) {
            const level = levels[levelIndex];
            if (!level) {
                return null;
            }

            let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(CELL_TYPES.grass));
            
            level.roadLayout.forEach(road => {
                if (road.type === 'horizontal') {
                    for (let i = 0; i < GRID_SIZE; i++) grid[road.y][i] = CELL_TYPES.road;
                } else if (road.type === 'vertical') {
                    for (let i = 0; i < GRID_SIZE; i++) grid[i][road.x] = CELL_TYPES.road;
                }
            });

            level.wallLayout.forEach(wall => grid[wall.y][wall.x] = CELL_TYPES.wall);


            const trapBuildings = level.trapBuildingLayout.map(trap => ({...trap}));
            trapBuildings.forEach(trap => grid[trap.y][trap.x] = CELL_TYPES.trapBuilding);

            level.fenceLayout.forEach(fence => grid[fence.y][fence.x] = CELL_TYPES.fence);
            grid[level.flagLocation.y][level.flagLocation.x] = CELL_TYPES.flag;


            return {
                grid: grid,
                playerPos: deepClone(level.playerPos),
                playerStatus: 'alive',
                isDriving: false,
                lastMoveDirection: {x: 0, y: 0},
                cars: deepClone(level.initialCarLocations),
                buses: deepClone(level.initialBusLocations),
                playerCar: deepClone(level.playerCar),
                strangers: deepClone(level.initialStrangerLocations),
                ducks: deepClone(level.initialDuckLocations),
                deadStrangers: [],
                deadDucks: [],
                bombs: [],
                explosions: [],
                destroyedTiles: [],
                wallLayout: deepClone(level.wallLayout),
                fenceLayout: deepClone(level.fenceLayout),
                trapBuildings: deepClone(level.trapBuildingLayout),//trapBuildings,
                inventory: { 'R': 0, 'E': 0, 'T': 0, 'money': 0 },
                devicesOnBoard: { 'R': deepClone(level.deviceLocations.R), 'E': deepClone(level.deviceLocations.E), 'T': deepClone(level.deviceLocations.T), 'money': deepClone(level.initialMoneyLocations)},
                deviceLocations: deepClone(level.deviceLocations),
                infoLocations: deepClone(level.infoLocations),
                flagLocation: deepClone(level.flagLocation),
                houseLocations: deepClone(level.houseLocations),
                eigengram: { isOn: false, lifetime: 0 },
                chronogram: { isOn: false, lifetime: 0, savedState: null },
                moveCount: 0
            };
        }
        
        const initGame = eval(initGameString);

        const drawGrid = eval(drawGridString);

        const drawEntities = eval(drawEntitiesString);

        function updateStatsDisplay(currentState) {
            timeCounterDisplay.textContent = `Time: ${currentState.moveCount}`;
            moneyAmountDisplay.textContent = `${currentState.inventory.money}`;
            levelCounterDisplay.textContent = `Level: ${currentLevel + 1}`;
        }
        
        function updateThreadIdDisplay() {
            const currentThreadId = threadIds[currentThreadIndex];
            currentThreadDisplay.textContent = currentThreadId === '' ? '∅' : currentThreadId;
        }
        
        function getLivingThreads() {
            return threadIds.filter(id => id !== '' && threadHistory[id].status === 'alive');
        }

        function updateThreadNavButtons() {
            prevThreadBtn.disabled = getLivingThreads().length <= 1;
            nextThreadBtn.disabled = getLivingThreads().length <= 1;
        }

        function getEigengramMessageForDisplay() {
            let checkId = threadIds[currentThreadIndex];
            if (eigengramSourceThreadId === '') return eigengramMessages[''] || '';
            while (checkId) {
                if (eigengramMessages[checkId] !== undefined) return eigengramMessages[checkId];
                checkId = checkId.slice(0, -1);
            }
            return '';
        }

        function updateDevicePanel(currentState) {
            qrgLabel.textContent = `QRG${currentState.inventory.R > 0 ? ` x ${currentState.inventory.R}` : ''}`;
            randomGeneratorBtn.disabled = currentState.inventory.R === 0;

            eigengramLabel.textContent = `Eigengram${currentState.inventory.E > 0 ? ` x ${currentState.inventory.E}` : ''}`;
            eigengramLifetimeDisplay.textContent = currentState.eigengram.isOn ? currentState.eigengram.lifetime : (currentState.inventory.E > 0 ? STARTING_LIFETIME : 0);
            eigengramIcon.className = `fas ${currentState.eigengram.isOn ? 'fa-bolt' : 'fa-lightbulb'}`;
            eigengramOnBtn.classList.toggle('active', currentState.eigengram.isOn);
            eigengramOnBtn.disabled = currentState.inventory.E === 0 || currentState.eigengram.isOn || isGameOver;
            eigengramMessagePanel.disabled = !currentState.eigengram.isOn || isGameOver;
            eigengramMessagePanel.value = currentState.eigengram.isOn ? (eigengramMessages[threadIds[currentThreadIndex]] || '') : getEigengramMessageForDisplay();

            chronogramLabel.textContent = `Chronogram${currentState.inventory.T > 0 ? ` x ${currentState.inventory.T}` : ''}`;
            chronogramLifetimeDisplay.textContent = currentState.chronogram.isOn ? currentState.chronogram.lifetime : (currentState.inventory.T > 0 ? STARTING_LIFETIME : 0);
            chronogramIcon.className = `fas ${currentState.chronogram.isOn ? 'fa-bolt' : 'fa-lightbulb'}`;
            chronogramOnBtn.classList.toggle('active', currentState.chronogram.isOn);
            chronogramOnBtn.disabled = currentState.inventory.T === 0 || currentState.chronogram.isOn || isGameOver;
            chronogramMessagePanel.disabled = !currentState.chronogram.isOn || isGameOver;
            sendBackBtn.disabled = isGameOver || !currentState.chronogram.isOn || currentState.chronogram.lifetime <= 0;
            chronogramMessagePanel.value = chronogramMessages[threadIds[currentThreadIndex]] || '';
            
            throwThreadBtn.disabled = false;
        }

        function flashLightning() {
            board.classList.add('lightning-flash');
            setTimeout(() => board.classList.remove('lightning-flash'), 200);
        }
        
        function gameOver() {
            isGameOver = true;
            gameOverMessage.style.display = 'block';
            gameWrapper.classList.add('game-over-backdrop');
            document.removeEventListener('keydown', handleKeyDown);
            document.addEventListener('keydown', handleRestart);
            updateDevicePanel({
                inventory: { R: 0, E: 0, T: 0, money: 0 },
                eigengram: { isOn: false, lifetime: 0 },
                chronogram: { isOn: false, lifetime: 0, savedState: null },
            });
            prevThreadBtn.disabled = true;
            nextThreadBtn.disabled = true;
            board.innerHTML = '';
        }

        function nextLevel() {
            currentLevel++;
            initGame();
        }
        
        function handleRestart(e) {
            if(e.key === 'r' || e.key === 'R') initGame();
        }
        
        function isObstacle(x, y, grid) {
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return true;
            const cellType = grid[y][x];
            const isSolid = cellType === CELL_TYPES.wall || cellType === CELL_TYPES.fence || cellType === CELL_TYPES.trapBuilding;
            const currentState = threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0];
            const isHouse = currentState.houseLocations.some(h => h.x === x && h.y === y);
            return isSolid || isHouse;
        }

        function checkPlayerCollisions(newState) {
            const { x, y } = newState.playerPos;
            if (newState.cars.some(c => c.x === x && c.y === y) || newState.buses.some(b => b.x === x && b.y === y)) {
                newState.playerStatus = 'dead';
            }
            return newState;
        }

        function checkStrangerCollisions(newState) {
            newState.strangers.forEach(s => {
                if (s.isDead) return;
                const hit = newState.cars.some(v => v.x === s.x && v.y === s.y) ||
                            newState.buses.some(v => v.x === s.x && v.y === s.y) ||
                            (newState.isDriving && s.x === newState.playerPos.x && s.y === newState.playerPos.y);
                if (hit) {
                    s.isDead = true;
                    s.deathTimer = DEATH_TIMER;
                    newState.deadStrangers.push({ ...s });
                }
            });
            
            newState.ducks.forEach(d => {
                if (d.isDead) return;
                const hit = newState.cars.some(v => v.x === d.x && v.y === d.y) ||
                            newState.buses.some(v => v.x === d.x && v.y === d.y) ||
                            (newState.isDriving && d.x === newState.playerPos.x && d.y === newState.playerPos.y);
                if (hit) {
                    d.isDead = true;
                    d.deathTimer = DEATH_TIMER;
                    newState.deadDucks.push({ ...d });
                }
            });
            return newState;
        }

        function checkItemPickup(newState) {
            const { x, y } = newState.playerPos;
            /*if (newState.devicesOnBoard.R && x === newState.deviceLocations.R.x && y === newState.deviceLocations.R.y) {
                newState.inventory.R++;
                newState.devicesOnBoard.R = false;
            }
            if (newState.devicesOnBoard.E && x === newState.deviceLocations.E.x && y === newState.deviceLocations.E.y) {
                newState.inventory.E++;
                newState.devicesOnBoard.E = false;
            }
            if (newState.devicesOnBoard.T && x === newState.deviceLocations.T.x && y === newState.deviceLocations.T.y) {
                newState.inventory.T++;
                newState.devicesOnBoard.T = false;
            }*/
            if (x === newState.flagLocation.x && y === newState.flagLocation.y) {
                nextLevel();
                return newState;
            }
            const moneyIndex = newState.devicesOnBoard.money.findIndex(m => m.x === x && m.y === y);
            if (moneyIndex !== -1) {
                newState.inventory.money++;
                newState.devicesOnBoard.money.splice(moneyIndex, 1);
            }
            const RanIndex = newState.devicesOnBoard.R.findIndex(m => m.x === x && m.y === y);
            if (RanIndex !== -1) {
                newState.inventory.R++;
                newState.devicesOnBoard.R.splice(RanIndex, 1);
            }
            const EigIndex = newState.devicesOnBoard.E.findIndex(m => m.x === x && m.y === y);
            if (EigIndex !== -1) {
                newState.inventory.E++;
                newState.devicesOnBoard.E.splice(EigIndex, 1);
            }
            const ChronIndex = newState.devicesOnBoard.T.findIndex(m => m.x === x && m.y === y);
            if (ChronIndex !== -1) {
                newState.inventory.T++;
                newState.devicesOnBoard.T.splice(ChronIndex, 1);
            }
            newState.infoLocations.forEach(m => {
                if (m.x === x && m.y === y) {
                    showInfoModal(m.text);
                    newState.infoLocations.splice(newState.infoLocations.findIndex(w => w.x === x && w.y === y), 1);
                }
            });
            return newState;
        }

        function triggerExplosion(bomb, state) {
            for (let ex = -2; ex <= 2; ex++) {
                for (let ey = -2; ey <= 2; ey++) {
                    const blastX = bomb.x + ex;
                    const blastY = bomb.y + ey;
                    if (blastX >= 0 && blastX < GRID_SIZE && blastY >= 0 && blastY < GRID_SIZE) {
                        if (!state.explosions.some(exp => exp.x === blastX && exp.y === blastY)) {
                            state.explosions.push({ x: blastX, y: blastY });
                        }
                        if (state.playerPos.x === blastX && state.playerPos.y === blastY) {
                            state.playerStatus = 'dead';
                        }
                        state.strangers.forEach(s => { if (!s.isDead && s.x === blastX && s.y === blastY) s.isDead = true; });
                        state.ducks.forEach(d => { if (!d.isDead && d.x === blastX && d.y === blastY) d.isDead = true; });
                    }
                }
            }
            state.bombs = state.bombs.filter(b => b.x !== bomb.x || b.y !== bomb.y);
        }
         
        const progressTurn = eval(progressTurnString);

        function sortThreadIds(ids) {
            return ids.sort((a, b) => {
                if (a === '') return -1; if (b === '') return 1;
                if (a.length !== b.length) return a.length - b.length;
                return a.localeCompare(b);
            });
        }
        
        function switchThread(direction) {
            const livingThreads = getLivingThreads();
            if (livingThreads.length <= 1) return;
            const currentId = threadIds[currentThreadIndex];
            const currentIndexInLiving = livingThreads.indexOf(currentId);
            let newIndexInLiving = direction === 'next' ? (currentIndexInLiving + 1) % livingThreads.length : (currentIndexInLiving - 1 + livingThreads.length) % livingThreads.length;
            currentThreadIndex = threadIds.indexOf(livingThreads[newIndexInLiving]);
            flashLightning();
            updateThreadIdDisplay();
            drawGrid();
        }

        function showDefuseModal(bomb) {
            activeBombToDefuse = bomb;
            defuseModal.style.display = 'block';
            document.removeEventListener('keydown', handleKeyDown);
            document.addEventListener('keydown', handleDefuseKeyPress);
        }

        function hideDefuseModal() {
            activeBombToDefuse = null;
            defuseModal.style.display = 'none';
            document.removeEventListener('keydown', handleDefuseKeyPress);
            document.addEventListener('keydown', handleKeyDown);
        }

        function handleDefuseAttempt(chosenWire) {
            if (!activeBombToDefuse) return;

            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            const bomb = currentState.bombs.find(b => b.x === activeBombToDefuse.x && b.y === activeBombToDefuse.y);

            if (bomb) {
                if (bomb.correctWire === chosenWire) {
                    currentState.bombs = currentState.bombs.filter(b => b.x !== bomb.x || b.y !== bomb.y);
                } else {
                    triggerExplosion(bomb, currentState);
                }
            }

            history.push(currentState);
            hideDefuseModal();
            drawGrid();
        }

        function handleDefuseKeyPress(e) {
            const key = e.key.toLowerCase();
            if (key === 'b') {
                handleDefuseAttempt('b');
            } else if (key === 'g') {
                handleDefuseAttempt('g');
            }
        }
        
        function handleKeyDown(e) {
            if (isGameOver) {
                handleRestart(e);
                return;
            }
            if (threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0].playerStatus === 'dead') {
                progressTurn();
                return;
            }

            const keyMap = {
                'ArrowUp': {x:0, y:-1}, 'ArrowDown': {x:0, y:1},
                'ArrowLeft': {x:-1, y:0}, 'ArrowRight': {x:1, y:0}
            };

            if (keyMap[e.key]) {
                e.preventDefault();
                playerDesiredMove = keyMap[e.key];
                progressTurn();
            } else {
                switch (e.key.toLowerCase()) {
                    case 'd':
                        e.preventDefault();
                        const currentState = threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0];
                        const playerPos = currentState.playerPos;
                        const bombOnCell = currentState.bombs.find(b => b.x === playerPos.x && b.y === playerPos.y);
                        if (bombOnCell) {
                            showDefuseModal(bombOnCell);
                        } else {
                            handleCarInteraction();
                        }
                        break;
                    case ' ': e.preventDefault(); progressTurn(); flashLightning(); break;
                    case 'r': e.preventDefault(); randomGeneratorBtn.click(); break;
                    case 'e': e.preventDefault(); if (!eigengramOnBtn.disabled) eigengramOnBtn.click(); break;
                    case 'c': e.preventDefault();
                        const state = threadHistory[threadIds[currentThreadIndex]].history.slice(-1)[0];
                        if (state.chronogram.isOn && !sendBackBtn.disabled) sendBackBtn.click();
                        else if (!chronogramOnBtn.disabled) chronogramOnBtn.click();
                        break;
                }
            }
        }

        function handleCarInteraction() {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            
            if (currentState.isDriving) {
                const { x, y } = currentState.playerPos;
                const directions = [{x:currentState.lastMoveDirection.x, y:currentState.lastMoveDirection.y},{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
                for (const dir of directions) {
                    const newX = x + dir.x, newY = y + dir.y;
                    if (!isObstacle(newX, newY, currentState.grid)) {
                        currentState.isDriving = false;
                        currentState.playerPos = {x: newX, y: newY};
                        break;
                    }
                }
            } else if (currentState.playerPos.x === currentState.playerCar.x && currentState.playerPos.y === currentState.playerCar.y) {
                currentState.isDriving = true;
            }

            history.push(currentState);
            drawGrid();
        }

        document.addEventListener('keydown', handleKeyDown);
        prevThreadBtn.addEventListener('click', () => switchThread('prev'));
        nextThreadBtn.addEventListener('click', () => switchThread('next'));
        
        throwThreadBtn.addEventListener('click', () => {
            const currentThreadId = threadIds[currentThreadIndex];
            if (!threadHistory[currentThreadId] || threadHistory[currentThreadId].status === 'dead') {
                const living = getLivingThreads();
                if (living.length > 0) {
                    currentThreadIndex = threadIds.indexOf(living[0]);
                    updateThreadIdDisplay();
                    drawGrid();
                } else gameOver();
                return;
            }

            threadHistory[currentThreadId].status = 'dead';
            const living = getLivingThreads();
            if (living.length > 0) {
                currentThreadIndex = threadIds.indexOf(living[0]);
                updateThreadIdDisplay();
                drawGrid();
            } else gameOver();
        });

        randomGeneratorBtn.addEventListener('click', () => {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const currentState = threadHistory[currentThreadId].history.slice(-1)[0];
            if (currentState.inventory.R > 0) {
                const newId0 = currentThreadId + '0', newId1 = currentThreadId + '1';
                const parentState = deepClone(currentState);
                parentState.inventory.R--;
                threadHistory[newId0] = {status: 'alive', history: [deepClone(parentState)]};
                threadHistory[newId1] = {status: 'alive', history: [deepClone(parentState)]};
                eigengramMessages[newId0] = getEigengramMessageForDisplay() || '';
                eigengramMessages[newId1] = getEigengramMessageForDisplay() || '';
                chronogramMessages[newId0] = chronogramMessages[currentThreadId] || '';
                chronogramMessages[newId1] = chronogramMessages[currentThreadId] || '';
                
                const newThreadIds = threadIds.filter(id => id !== currentThreadId);
                newThreadIds.push(newId0, newId1);
                threadIds = sortThreadIds(newThreadIds);
                currentThreadIndex = threadIds.indexOf(newId0);
                
                updateThreadIdDisplay();
                drawGrid();
            }
        });
        
        eigengramOnBtn.addEventListener('click', () => {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            if (currentState.inventory.E > 0 && !currentState.eigengram.isOn) {
                currentState.inventory.E--;
                currentState.eigengram.isOn = true;
                currentState.eigengram.lifetime = STARTING_LIFETIME;
                history.push(currentState);
                eigengramSourceThreadId = currentThreadId;
                drawGrid();
            }
        });

        eigengramMessagePanel.addEventListener('input', (e) => {
            if (isGameOver) return;
            const message = e.target.value;
            const currentThreadId = threadIds[currentThreadIndex];
            if (threadHistory[currentThreadId].history.slice(-1)[0].eigengram.isOn) {
                if (eigengramSourceThreadId === '') {
                    threadIds.forEach(id => eigengramMessages[id] = message);
                } else {
                    eigengramMessages[currentThreadId] = message;
                }
                drawGrid();
            }
        });

        chronogramOnBtn.addEventListener('click', () => {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const history = threadHistory[currentThreadId].history;
            const currentState = deepClone(history.slice(-1)[0]);
            if (currentState.inventory.T > 0 && !currentState.chronogram.isOn) {
                currentState.inventory.T--;
                currentState.chronogram.isOn = true;
                currentState.chronogram.lifetime = STARTING_LIFETIME;
                currentState.chronogram.savedState = deepClone(currentState);
                history.push(currentState);
                drawGrid();
            }
        });

        chronogramMessagePanel.addEventListener('input', (e) => {
            if (isGameOver) return;
            chronogramMessages[threadIds[currentThreadIndex]] = e.target.value;
        });

        sendBackBtn.addEventListener('click', () => {
            if (isGameOver) return;
            const currentThreadId = threadIds[currentThreadIndex];
            const currentState = threadHistory[currentThreadId].history.slice(-1)[0];
            if (currentState.chronogram.isOn && currentState.chronogram.lifetime > 0) {
                const { savedState } = currentState.chronogram;
                const messageToSend = chronogramMessagePanel.value;
                const newPresentId = currentThreadId + '0', newPastId = currentThreadId + '1';
                
                const newPresentHistory = deepClone(threadHistory[currentThreadId].history);
                const newPresentState = newPresentHistory.slice(-1)[0];
                newPresentState.chronogram.savedState = null;
                threadHistory[newPresentId] = {status: 'alive', history: newPresentHistory};
                eigengramMessages[newPresentId] = getEigengramMessageForDisplay() || '';
                chronogramMessages[newPresentId] = chronogramMessages[currentThreadId] || '';
                
                const pastState = deepClone(savedState);
                pastState.chronogram = { isOn: true, lifetime: STARTING_LIFETIME, savedState: null };
                pastState.inventory.T ++;
                chronogramMessages[newPastId] = messageToSend;
                threadHistory[newPastId] = {status: 'alive', history: [pastState]};
                eigengramMessages[newPastId] = getEigengramMessageForDisplay() || '';

                const newThreadIds = threadIds.filter(id => id !== currentThreadId);
                newThreadIds.push(newPresentId, newPastId);
                threadIds = sortThreadIds(newThreadIds);
                currentThreadIndex = threadIds.indexOf(newPastId);
                
                updateThreadIdDisplay();
                drawGrid();
            }
        });
        
        cutBlackWireBtn.addEventListener('click', () => handleDefuseAttempt('b'));
        cutGreenWireBtn.addEventListener('click', () => handleDefuseAttempt('g'));

        initGame();
    });
</script>
</body>
</html>
